{% extends "base.html" %}
{% block title %}{{ post['title'] }} — Блог{% endblock %}

{% block content %}
<div class="container">
    <a href="/blog" class="btn btn-outline btn-sm" style="margin-bottom: 2rem;">← Все статьи</a>

    <article class="blog-post">
        <h1>{{ post['title'] }}</h1>
        <p class="blog-post-date">{{ post['created_at'][:10] }}</p>

        {% if post['image_url'] %}
            <img src="{{ post['image_url'] }}" alt="{{ post['title'] }}" class="blog-post-image">
        {% endif %}

        <div class="blog-post-content">
            {{ post['content']|safe }}
        </div>
    </article>
</div>
{% endblock %}
