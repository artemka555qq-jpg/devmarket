{% extends "base.html" %}
{% block title %}Регистрация — {{ brand.name }}{% endblock %}

{% block content %}
<div class="container">
    <div class="auth-page">
        <h1>Регистрация</h1>
        <p class="auth-subtitle">Создайте аккаунт за 10 секунд</p>

        <form method="post" class="auth-form">
            <div class="form-group">
                <label>Логин</label>
                <input type="text" name="username" class="form-input" required minlength="3" autofocus>
                <small>Минимум 3 символа</small>
            </div>

            <div class="form-group">
                <label>Email</label>
                <input type="email" name="email" class="form-input" required>
            </div>

            <div class="form-group">
                <label>Пароль</label>
                <input type="password" name="password" class="form-input" required minlength="6">
                <small>Минимум 6 символов</small>
            </div>

            <button type="submit" class="btn btn-primary btn-full">Зарегистрироваться</button>

            <p class="auth-switch">
                Уже есть аккаунт? <a href="/login">Войти</a>
            </p>
        </form>
    </div>
</div>
{% endblock %}
