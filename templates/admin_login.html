{% extends "base.html" %}
{% block title %}Вход в админку — {{ brand.name }}{% endblock %}

{% block content %}
<div class="container">
    <div class="auth-page">
        <h1>🔐 Админ-панель</h1>
        <p class="auth-subtitle">Введите пароль для управления магазином</p>

        <form method="post" class="auth-form">
            <div class="form-group">
                <label>Пароль</label>
                <input type="password" name="password" class="form-input" required autofocus>
            </div>

            <button type="submit" class="btn btn-primary btn-full">Войти</button>
        </form>
    </div>
</div>
{% endblock %}
